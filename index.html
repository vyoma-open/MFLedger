<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1021" />
    <meta name="description" content="Local-first Indian mutual fund portfolio tracker. Track holdings, SIPs, capital gains tax, and XIRR — all offline." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MFLedger" />
    <link rel="preload" href="/fonts/ieVn2YZDLWuGJpnzaiwFXS9tYtpd59CxCis4.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/L0x5DF4xlVMF-BfR8bXMIjhLq3-cXbKD.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>MFLedger — Mutual Fund Portfolio & Research</title>
    <script>
      (function() {
        // 1. Dynamic chunk loading error recovery
        window.addEventListener('error', function(e) {
          var message = e.message || '';
          if (message.indexOf('Loading chunk') !== -1 || message.indexOf('Failed to fetch dynamically imported module') !== -1) {
            var lastReload = localStorage.getItem('last_chunk_reload');
            var now = Date.now();
            if (!lastReload || (now - parseInt(lastReload, 10)) > 10000) {
              localStorage.setItem('last_chunk_reload', now);
              console.warn('Chunk loading error caught. Clearing caches and reloading...');
              if ('caches' in window) {
                caches.keys().then(function(keys) {
                  return Promise.all(keys.map(function(k) { return caches.delete(k); }));
                }).finally(function() {
                  window.location.reload();
                });
              } else {
                window.location.reload();
              }
            }
          }
        }, true);

        // 2. Development mode service worker auto-unregister
        var isDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        if (isDev && 'serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            var reloaded = false;
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister().then(function(success) {
                if (success && !reloaded) {
                  reloaded = true;
                  console.log('Unregistered active service worker on localhost.');
                  if ('caches' in window) {
                    caches.keys().then(function(keys) {
                      return Promise.all(keys.map(function(k) { return caches.delete(k); }));
                    }).finally(function() {
                      window.location.reload();
                    });
                  } else {
                    window.location.reload();
                  }
                }
              });
            }
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <style>
        .initial-loader {
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background-color: #0B1021;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          font-family: 'Hanken Grotesk', system-ui, -apple-system, sans-serif;
          color: #EDEDED;
          z-index: 9999;
        }
        .initial-loader-logo {
          width: 56px;
          height: 56px;
          border-radius: 14px;
          margin-bottom: 16px;
          box-shadow: 0 6px 24px rgba(0, 179, 134, 0.25);
          animation: initial-pulse 2s ease-in-out infinite;
        }
        .initial-loader-text {
          font-size: 12px;
          color: #9899A3;
          letter-spacing: 0.05em;
          text-transform: uppercase;
          font-weight: 600;
        }
        @keyframes initial-pulse {
          0%, 100% { opacity: 0.8; transform: scale(1); }
          50% { opacity: 1; transform: scale(1.04); }
        }
      </style>
      <div class="initial-loader">
        <img src="/logo.png" alt="MFLedger Logo" class="initial-loader-logo" />
        <div class="initial-loader-text">Loading MFLedger…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
